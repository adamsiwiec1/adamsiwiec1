name: Refresh activity stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/refresh_activity.py"
      - ".github/workflows/refresh-activity.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh stats
        env:
          # Needs a classic PAT with `repo` to include private contribution totals.
          # Fall back to the job token for public-only numbers.
          GH_TOKEN: ${{ secrets.ACTIVITY_TOKEN || github.token }}
        run: python3 scripts/refresh_activity.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/activity-panel.svg assets/activity-stats.svg assets/activity-stats.json assets/contribution-graph-90d.svg
          git add -u assets/activity-repos.svg || true
          if git diff --cached --quiet; then
            echo "No activity changes"
            exit 0
          fi
          git commit -m "Refresh activity stats"
          git push
